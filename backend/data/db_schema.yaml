csv.BridgeBio_CSV:
  columns:
    People.Active:
      description: 'Indicates whether the employee is currently active, useful for
        filtering active vs inactive employees; format: TEXT; sample values: ''YES'',
        ''NO''.'
      type: TEXT
    People.Country:
      description: 'The country of the employee, useful for international workforce
        analysis; format: TEXT; sample values: ''US'', ''United States of America''.'
      type: TEXT
    People.Created Date:
      description: 'The date the employee''s profile was created, useful for tracking
        onboarding trends; format: DD-MM-YYYY; Convert: DATE(substr(col,7,4)||''-''||substr(col,4,2)||''-''||substr(col,1,2));
        sample values: ''04-06-2026'', ''04-07-2026''.'
      type: TEXT
    People.Department:
      description: 'The department the employee belongs to, critical for departmental
        performance analysis; format: TEXT; sample values: ''115 - Manufacturing'',
        ''515 - Human Resources''.'
      type: TEXT
    People.Division:
      description: 'The division within the company, useful for grouping by organizational
        structure; format: TEXT; sample values: ''Calcilytix'', ''BridgeBio International
        GmbH''.'
      type: TEXT
    People.First Name:
      description: 'The first name of the employee, useful for personalization in
        reports; format: TEXT; sample values: ''Alex'', ''Artem''.'
      type: TEXT
    People.Hire Date:
      description: 'The date the employee was hired, useful for tenure analysis; format:
        DD-MM-YYYY; Convert: DATE(substr(col,7,4)||''-''||substr(col,4,2)||''-''||substr(col,1,2));
        sample values: ''04-06-2026'', ''11/14/2022''.'
      type: TEXT
    People.Last Name:
      description: 'The last name of the employee, also useful for personalization;
        format: TEXT; sample values: ''Nichols'', ''Burmakin''.'
      type: TEXT
    People.Manager:
      description: 'The manager of the employee, useful for hierarchical analysis;
        format: TEXT; sample values: ''None'', ''Josh Loehrer''.'
      type: TEXT
    People.Profile Type:
      description: 'Indicates the type of profile (e.g., Internal, None), useful for
        filtering employee categories; format: TEXT; sample values: ''Internal'',
        ''None''.'
      type: TEXT
    People.State:
      description: 'The state where the employee is located, useful for regional analysis;
        format: TEXT; sample values: ''CA'', ''None''.'
      type: TEXT
    People.Title:
      description: 'The job title of the employee, useful for grouping by roles; format:
        TEXT; sample values: ''Associate Director, Drug Substance'', ''Director, People
        Operations, Intern''.'
      type: TEXT
    People.Title.1:
      description: 'An alternate title for the employee, useful for additional context
        in reports; format: TEXT; sample values: ''Associate Director, Drug Substance'',
        ''Director, People Operations, Intern''.'
      type: TEXT
    People.Type of Employee:
      description: 'Indicates the employment type (e.g., Full-Time), useful for analyzing
        workforce composition; format: TEXT; sample values: ''Full-Time'', ''Part-Time''.'
      type: TEXT
    People.Username:
      description: 'The unique identifier for each employee, used in JOIN operations;
        format: TEXT; sample values: ''Alex.Nichols@bridgebio.com'', ''Artem.Burmakin@bridgebio.com''.'
      type: TEXT
  count_column: ''
  description: The BridgeBio_CSV table contains detailed information about employees
    within the organization, capturing essential attributes such as their roles, status,
    and departmental affiliations. Each row represents an individual employee, making
    it suitable for various analytics use cases, including workforce analysis, departmental
    performance evaluation, and employee engagement metrics. Critical columns for
    filtering and grouping include 'People.Department', 'People.Profile Type', and
    'People.Active', which allow analysts to segment data based on organizational
    structure and employee status.
  enriched: true
  entity_name_columns: []
  filter_hints: []
  inline_value_columns: []
