    STATE:
      description: 'State where the hospital is situated, useful for filtering by
        state (WHERE). Format: TEXT. Sample values: ''WI'', ''CA''.'
      type: TEXT
  count_column: ''
  description: The hospital_center table contains detailed information about various
    clinical study sites across different geographical regions. Each row represents
    a unique hospital or medical center, providing insights into their onboarding
    milestones and organizational details. This data is crucial for pharma commercial
    analysts to identify potential partners, assess market segmentation, and track
