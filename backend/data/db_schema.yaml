    RECORD_ID:
      description: 'Unique identifier for each record, important for distinct counts
        and joins (COUNT DISTINCT/JOIN). Format: INTEGER. Sample values: 16, 21.'
      type: INTEGER
    SEGMENT:
      description: 'Indicates the market segment of the hospital, useful for grouping
        and filtering (GROUP BY). Format: TEXT. Sample values: ''High''.'
