csv.hospital_center:
  columns:
    CLINICAL_STUDY_SITE:
      description: 'Specifies whether the hospital is a clinical study site, important
        for grouping and filtering (WHERE). Format: TEXT. Sample values: ''YES'',
        ''NO''.'
      type: TEXT
    GEOGRAPHICAL_REGION:
      description: 'Indicates the geographical area where the hospital is located,
        useful for filtering by region (WHERE). Format: TEXT. Sample values: ''North
        Region'', ''West Region''.'
      type: TEXT
    HOSPITAL_ONBOARDING_MILESTONE:
      description: 'Describes the onboarding status of the hospital, critical for
        filtering and understanding progress (WHERE). Format: TEXT. Sample values:
        ''Authorized'', ''Introduction''.'
      type: TEXT
    ORG_ADDRESS_CITY:
      description: 'City where the organization is located, important for geographical
        filtering (WHERE). Format: TEXT. Sample values: ''MILWAUKEE'', ''SACRAMENTO''.'
      type: TEXT
    ORG_ID:
      description: 'Unique identifier for the organization, essential for joins and
        distinct counts (JOIN/COUNT DISTINCT). Format: TEXT. Sample values: ''US22'',
        ''US27''.'
      type: TEXT
    ORG_ID_COPS_CENTER_ID:
      description: 'Identifier for the COPS center associated with the organization,
        useful for joins (JOIN). Format: TEXT. Sample values: ''001Tu00000Vr7OEIAZ'',
        ''None''.'
      type: TEXT
    ORG_NAME:
      description: 'Name of the organization, useful for display and filtering (WHERE).
        Format: TEXT. Sample values: ''Froedtert Hospital (Medical College'', ''UC
        Davis Stem Cell Transplant Progr''.'
