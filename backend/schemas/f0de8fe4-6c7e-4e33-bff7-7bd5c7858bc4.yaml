- name: ENROLLMENT_PATIENT_CLAIMS_MASTER
  description: The ENROLLMENT_PATIENT_CLAIMS_MASTER table contains detailed records
    of patient claims and enrollment information related to pharmacy transactions.
    It includes data on transaction types, out-of-pocket costs, benefit flags, claim
    details, enrollment status, and patient demographics. The table captures various
    dates related to claims processing, such as the date of fill and date written,
    along with identifiers like claim authorization numbers and patient IDs.
  columns:
  - name: Transaction type 1
    type: string
    sample_values:
    - Claimed
    - Returned
    description: Indicates whether the transaction was claimed or returned.
  - name: OOP
    type: string
    sample_values:
    - Fully Covered
    - Partially Covered
    description: Specifies the out-of-pocket coverage status, such as fully or partially
      covered.
  - name: BENEFIT_FLG
    type: string
    sample_values:
    - 0-50%
    - 50-70%
    - 90-100%
    - 70-90%
    description: Represents the percentage range of benefits covered, such as 0-50%,
      50-70%, or 90-100%.
  - name: Claim Bucket
    type: string
    sample_values:
    - Within 6 Month
    - After 6 Months
    description: Categorizes claims based on the time frame, such as within 6 months
      or after 6 months.
  - name: HasReversal
