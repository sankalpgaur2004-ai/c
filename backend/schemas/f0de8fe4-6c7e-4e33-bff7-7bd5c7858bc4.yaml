  description: This measure returns a string indicating either 'Claim Volume' or 'Patient
    Count' based on the selected value in the 'Volume Metric'[Column1]. It uses the
    'Volume Metric' table and applies a filter condition to determine the appropriate
    header text.
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Volume Metric'[Column1])\
    \ && SELECTEDVALUE('Volume Metric'[Column1])=\"Claim Volume\",\"Claim Volume\"\
    ,\n                    ISFILTERED('Volume Metric'[Column1]) && SELECTEDVALUE('Volume\
    \ Metric'[Column1])=\"Patient Count\",\"Patient Count\")"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Spend metrics
  description: This measure calculates either the total Biogen spend or the Biogen
    spend per patient based on the selected value in the 'Spend Metric'[Column1].
    It uses the 'Spend Metric' table and applies a filter condition to check if 'Column1'
    is filtered and matches specific values.
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Spend Metric'[Column1])\
    \ && SELECTEDVALUE('Spend Metric'[Column1])=\"Total Biogen Spend\",[Biogen spend],\n\
    \                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend per Patient\",[Biogen spend per patient],\n\
    \                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend Per Claim\",[Biogen spend per claim])"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Biogen spend
  - Biogen spend per claim
  - Biogen spend per patient
- name: Spend metrics header
  description: This measure returns a string indicating either 'Total Biogen Spend'
    or 'Biogen Spend per Patient' based on the selected value in the 'Spend Metric'[Column1].
    It uses the 'Spend Metric' table and applies a filter condition to determine the
    appropriate header text.
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Spend Metric'[Column1])\
    \ && SELECTEDVALUE('Spend Metric'[Column1])=\"Total Biogen Spend\",\"Total Biogen\
    \ Spend\",\n                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend per Patient\",\"Biogen Spend per Patient\"\
    ,\n                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend Per Claim\",\"Biogen Spend Per Claim\")"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Total Patient Benefit (MAXIMIZER)
  description: This measure calculates the total patient benefit by summing the 'PATIENTBENEFIT'
    column from the 'MAXIMIZER_SPEND' table. It applies a filter using TREATAS to
    match 'PRODUCT_BRAND_NAME' from 'US_PRODUCT_MASTER' with 'BRANDNAME' in 'MAXIMIZER_SPEND'.
  expression: "CALCULATE(\n    SUM ( MAXIMIZER_SPEND[PATIENTBENEFIT] )\n    , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),MAXIMIZER_SPEND[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Patient_count_pharmacy
  description: This measure calculates the distinct count of 'CLAIMAUTHORIZATIONNUMBER'
    from the 'PHARMACY_CLAIMS_FACT' table where 'CLAIM_TRANSACTION_TYPE_FLG' equals
    1. It uses TREATAS to filter by matching 'PRODUCT_BRAND_NAME' from 'US_PRODUCT_MASTER'
    with 'BRANDNAME' in 'PHARMACY_CLAIMS_FACT'.
  expression: "CALCULATE(DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]),\
    \ \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG] = 1,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Successful_Claim_PAT
  description: This measure counts the number of 'MEMBERID' entries in the 'PHARMACY_CLAIMS_FACT'
    table where 'CLAIM_TRANSACTION_TYPE_FLG' equals 1. It applies a filter using TREATAS
    to match 'PRODUCT_BRAND_NAME' from 'US_PRODUCT_MASTER' with 'BRANDNAME' in 'PHARMACY_CLAIMS_FACT'.
  expression: "CALCULATE(COUNT(PHARMACY_CLAIMS_FACT[MEMBERID]), \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,\
    \ TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Quantity redeemption
  description: This measure calculates the sum of 'QUANTITY' from the 'PHARMACY_CLAIMS_FACT'
    table where 'CLAIM_TRANSACTION_TYPE_FLG' equals 1. It uses USERELATIONSHIP to
    relate 'DATE_DIM_ENR'[DATE] with 'PHARMACY_CLAIMS_FACT'[DATEOFFILL] and applies
    TREATAS to filter by 'PRODUCT_BRAND_NAME'.
  expression: 'CALCULATE(SUM(PHARMACY_CLAIMS_FACT[QUANTITY]),PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,

    USERELATIONSHIP(''DATE_DIM_ENR''[DATE],PHARMACY_CLAIMS_FACT[DATEOFFILL]) , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrolled Claimed Within 6M
  description: This measure calculates the distinct count of members from the IQV_ENROLLMENT_DIM
    table who have made a claim within 180 days of enrollment. It filters the PHARMACY_CLAIMS_FACT
    table for claims with a transaction type flag of 1 and a Days_Enrollment value
    between 0 and 180.
  expression: "\n    CALCULATE(\n        DISTINCTCOUNT( IQV_ENROLLMENT_DIM[MEMBERID]\
    \ ),\n        FILTER(\n            IQV_ENROLLMENT_DIM,\n            CALCULATE(\n\
    \                COUNTROWS( PHARMACY_CLAIMS_FACT ),\n                PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1,\n                PHARMACY_CLAIMS_FACT[Days_Enrollment] >= 0,\n        \
    \        PHARMACY_CLAIMS_FACT[Days_Enrollment] <= 180\n            ) > 0\n   \
    \     ), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    \    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrolled Claimed After 6M
  description: This measure calculates the distinct count of members from the IQV_ENROLLMENT_DIM
    table who have made a claim after 180 days of enrollment. It filters the PHARMACY_CLAIMS_FACT
    table for claims with a transaction type flag of 1 and a Days_Enrollment value
    greater than 180, and applies a TREATAS function to align product brand names.
  expression: "\n     CALCULATE(\n        DISTINCTCOUNT( IQV_ENROLLMENT_DIM[MEMBERID]\
    \ ),\n        FILTER(\n            IQV_ENROLLMENT_DIM,\n            CALCULATE(\n\
    \                COUNTROWS( PHARMACY_CLAIMS_FACT ),\n                PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1,\n                PHARMACY_CLAIMS_FACT[Days_Enrollment] > 180\n        \
    \    ) > 0\n        ), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),\
    \ PHARMACY_CLAIMS_FACT[BRANDNAME])\n    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrolled But No Claims Till Date
  description: This measure calculates the distinct count of members from the IQV_ENROLLMENT_DIM
    table who have not made any claims to date. It uses the TREATAS function to align
    product brand names between the US_PRODUCT_MASTER and PHARMACY_CLAIMS_FACT tables
    and filters for members with zero claims.
  expression: "CALCULATE(DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID])\n,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),\n\
    \        IQV_ENROLLMENT_DIM[BRANDNAME]),\nFILTER(IQV_ENROLLMENT_DIM,\nCALCULATE(COUNTROWS(PHARMACY_CLAIMS_FACT),\n\
    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1)=0\n)\n,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrollment Balance Check
  description: This measure calculates the balance of total enrollments by subtracting
    the counts of members who claimed within 6 months, after 6 months, and those with
    no claims till date from the total enrollment.
  expression: '[Total enrollment]     - [Enrolled Claimed Within 6M]     - [Enrolled
    Claimed After 6M]     - [Enrolled But No Claims Till Date]'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Total enrollment
  - Enrolled Claimed Within 6M
  - Enrolled Claimed After 6M
  - Enrolled But No Claims Till Date
- name: DATE_RELATION_CHECK
  description: This measure counts the number of rows in the DATE_DIM_DOF table, which
    is likely used to verify the integrity or completeness of date-related data.
  expression: '

    COUNTROWS(DATE_DIM_DOF)'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: 90th Percentile Claim Cost
  description: This measure calculates the 90th percentile of patient benefits from
    the PHARMACY_CLAIMS_FACT table for claims with a transaction type flag of 1. It
    uses the TREATAS function to align product brand names between the US_PRODUCT_MASTER
    and PHARMACY_CLAIMS_FACT tables.
  expression: "\n    CALCULATE( PERCENTILEX.INC(\n            FILTER(\n          \
    \      PHARMACY_CLAIMS_FACT,\n                PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1\n            ),\n            PHARMACY_CLAIMS_FACT[PATIENTBENEFIT],\n   \
    \         0.9\n        ),TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    \    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Claims ≥ 90th Percentile
  description: This measure calculates the number of claims where the patient benefit
    is greater than or equal to the 90th percentile claim cost. It uses a variable
    to store the 90th percentile value and applies the TREATAS function to align product
    brand names.
  expression: "\nVAR P90 =\n    [90th Percentile Claim Cost]\nRETURN\nCALCULATE(\n\
    \    [No. of claims],\n            PHARMACY_CLAIMS_FACT[PATIENTBENEFIT] >= P90\
    \ , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - No. of claims
  - 90th Percentile Claim Cost
- name: Rows With TREATAS
  description: This measure counts the number of rows in the PHARMACY_CLAIMS_FACT
    table where the claim transaction type flag is 1. It uses the TREATAS function
    to align product brand names between the US_PRODUCT_MASTER and PHARMACY_CLAIMS_FACT
    tables.
  expression: "\nCALCULATE(\n    COUNTROWS(PHARMACY_CLAIMS_FACT),\n    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1,\n    TREATAS(\n        VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),\n\
    \        PHARMACY_CLAIMS_FACT[BRANDNAME]\n    )\n)"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Rows Without TREATAS
  description: This measure calculates the number of rows in the PHARMACY_CLAIMS_FACT
    table where the CLAIM_TRANSACTION_TYPE_FLG column equals 1. It uses the COUNTROWS
    function within a CALCULATE function to apply the filter condition.
  expression: "\nCALCULATE(\n    COUNTROWS(PHARMACY_CLAIMS_FACT),\n    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1\n)"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Debug Filters
  description: This measure concatenates and returns a string of unique brand names
    from the PHARMACY_CLAIMS_FACT table. It uses the CONCATENATEX function to iterate
    over the distinct values of the BRANDNAME column, separating them with a comma.
  expression: "\nCONCATENATEX(\n    VALUES(PHARMACY_CLAIMS_FACT[BRANDNAME]),\n   \
    \ PHARMACY_CLAIMS_FACT[BRANDNAME],\n    \", \"\n)"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Distinct Members Visible
  description: This measure calculates the distinct count of MEMBERID in the PHARMACY_CLAIMS_FACT
    table where the CLAIM_TRANSACTION_TYPE_FLG column equals 1. It uses the DISTINCTCOUNT
    function within a CALCULATE function to apply the filter condition.
  expression: 'CALCULATE(

    DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[MEMBERID]), PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]
    = 1)'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: T.LAST UPDATE
  description: This measure returns the earliest date from the LAST_UPDATED_DATE column
    in the PHARMACY_CLAIMS_FACT table. It uses the MIN function to find the minimum
    date value.
  expression: MIN(PHARMACY_CLAIMS_FACT[LAST_UPDATED_DATE])
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: T.Rows in Maximizer Spend
  description: This measure calculates the total number of rows in the MAXIMIZER_SPEND
    table. It uses the COUNTROWS function to perform this calculation.
  expression: COUNTROWS(MAXIMIZER_SPEND)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
