measures:
- name: Amount per claim
  description: This measure calculates the average patient benefit amount per claim
    by dividing the total patient benefit by the distinct count of claim authorization
    numbers. It uses the PHARMACY_CLAIMS_FACT table and applies a filter where CLAIM_TRANSACTION_TYPE_FLG
    equals 1, and it matches product brand names using the TREATAS function.
  expression: 'CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT])/DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1 , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Last Updated
  description: This measure calculates the last updated time by subtracting 5 hours
    from the maximum UTC time in the LastRefresh table. It returns a formatted string
    indicating the last update time in EST.
  expression: "\nVAR LastRefreshTime = MAX(LastRefresh[UTC_Time]) - TIME(5,0,0)\n\
    \ \nRETURN \"Last Updated: \" & FORMAT(LastRefreshTime, \"MMM dd, yyyy, hh:mm\
    \ AM/PM\") & \" EST\""
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Utilizing
  description: This measure calculates the number of members utilizing the service
    by subtracting the count of members enrolled but with no claims from the total
    enrollment.
  expression: '[Total enrollment] - [Enrolled But No Claims Till Date]'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Total enrollment
  - Enrolled But No Claims Till Date
- name: Total enrollment
  description: This measure calculates the distinct count of members enrolled using
    the IQV_ENROLLMENT_DIM table. It applies a filter to match product brand names
    using the TREATAS function.
  expression: CALCULATE( DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID]), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),IQV_ENROLLMENT_DIM[BRANDNAME]))
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Redemption Rate
  description: This measure calculates the redemption rate by dividing the number
    of utilizing members by the total enrollment. It uses a default value of 0 to
    handle division by zero.
  expression: DIVIDE([Utilizing],[Total enrollment],0)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Utilizing
  - Total enrollment
- name: Enrollment from hub
  description: This measure calculates the distinct count of members enrolled through
    the 'HUB Portal' channel using the IQV_ENROLLMENT_DIM table. It applies a filter
    to match product brand names using the TREATAS function.
  expression: 'CALCULATE(DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID]),

    IQV_ENROLLMENT_DIM[ENROLLMENTCHANNEL]="HUB Portal" , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),IQV_ENROLLMENT_DIM[BRANDNAME])
    )


    '
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrollment from patient portal
  description: This measure calculates the distinct count of members enrolled through
    the 'Patient Portal' channel using the IQV_ENROLLMENT_DIM table. It applies a
    filter to match product brand names using the TREATAS function.
  expression: 'CALCULATE(DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID]),

    IQV_ENROLLMENT_DIM[ENROLLMENTCHANNEL]="Patient Portal" , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),IQV_ENROLLMENT_DIM[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Bottles with copay redemption
  description: This measure calculates the total quantity of bottles with copay redemption
    using the PHARMACY_CLAIMS_FACT table. It applies a filter where CLAIM_TRANSACTION_TYPE_FLG
    equals 1 and matches product brand names using the TREATAS function.
  expression: "CALCULATE(SUM(PHARMACY_CLAIMS_FACT[QUANTITY]),\nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1\
    \  \n,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Total copay support
  description: This measure calculates the total patient benefit from the PHARMACY_CLAIMS_FACT
    table where the claim transaction type flag is 1. It applies a filter using the
    TREATAS function to match product brand names from the US_PRODUCT_MASTER table
    to the brand names in the PHARMACY_CLAIMS_FACT table.
  expression: 'CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1, TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Average copay support
  description: This measure computes the average patient benefit for claims with a
    transaction type flag of 1 in the PHARMACY_CLAIMS_FACT table. It uses the AVERAGEX
    function over a filtered table and applies a TREATAS filter to align product brand
    names between the US_PRODUCT_MASTER and PHARMACY_CLAIMS_FACT tables.
  expression: "CALCULATE(AVERAGEX(FILTER(PHARMACY_CLAIMS_FACT, \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1),\n\
    PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Median copay support
  description: This measure determines the median patient benefit for claims with
    a transaction type flag of 1 in the PHARMACY_CLAIMS_FACT table. It uses the MEDIANX
    function on a filtered table and applies a TREATAS filter to match product brand
    names from the US_PRODUCT_MASTER table to those in the PHARMACY_CLAIMS_FACT table.
  expression: "CALCULATE(MEDIANX(FILTER(PHARMACY_CLAIMS_FACT, \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1),\n\
    PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]),TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Max copay support
  description: This measure finds the maximum patient benefit from the PHARMACY_CLAIMS_FACT
    table where the claim transaction type flag is 1. It uses a TREATAS filter to
    align product brand names between the US_PRODUCT_MASTER and PHARMACY_CLAIMS_FACT
    tables.
  expression: 'CALCULATE(MAX(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Copay card support
  description: This measure calculates the total patient benefit for claims with a
    transaction type flag of 1 in the PHARMACY_CLAIMS_FACT table, using a specific
    date relationship with the DATE_DIM_ENR table. It also applies a TREATAS filter
    to match product brand names between the US_PRODUCT_MASTER and PHARMACY_CLAIMS_FACT
    tables.
  expression: 'CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,

    USERELATIONSHIP(''DATE_DIM_ENR''[Date],PHARMACY_CLAIMS_FACT[DATEOFFILL]),TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Total Patients
  description: This measure counts the distinct number of patients (MEMBERID) in the
    PHARMACY_CLAIMS_FACT table where the claim transaction type flag is 1. It uses
    a TREATAS filter to align product brand names between the US_PRODUCT_MASTER and
    PHARMACY_CLAIMS_FACT tables.
  expression: '

    CALCULATE(DISTINCTCOUNT ( PHARMACY_CLAIMS_FACT[MEMBERID] ),PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,
    TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Average Claims per Patient
  description: This measure calculates the average number of claims per patient by
    dividing the total number of claims by the total number of distinct patients.
  expression: '

    DIVIDE ( [No. of claims], [Total Patients] )'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Total Patients
  - No. of claims
- name: Total Claims - Medical
  description: This measure counts the distinct claim authorization numbers in the
    PHARMACY_CLAIMS_FACT table for medical claims where the claim transaction type
    flag is 1. It applies a TREATAS filter to match product brand names between the
    US_PRODUCT_MASTER and PHARMACY_CLAIMS_FACT tables.
  expression: '

    CALCULATE(DISTINCTCOUNT (PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]  ),PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,PHARMACY_CLAIMS_FACT[CLAIM_TYPE]="MEDICAL",
    TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Total Claims - Pharmacy
  description: This measure calculates the distinct count of claim authorization numbers
    from the PHARMACY_CLAIMS_FACT table where the claim transaction type flag is 1
    and the claim type is 'PHARMACY'. It also applies a filter using the TREATAS function
    to match product brand names from the US_PRODUCT_MASTER table.
  expression: '

    CALCULATE(DISTINCTCOUNT (PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]  ),PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,PHARMACY_CLAIMS_FACT[CLAIM_TYPE]="PHARMACY"
    ,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Total Patients1
  description: This measure counts the number of patient keys in the PHARMACY_CLAIMS_FACT
    table where the claim transaction type flag is 1. It uses the TREATAS function
    to filter by product brand names from the US_PRODUCT_MASTER table.
  expression: '

    CALCULATE(COUNT ( PHARMACY_CLAIMS_FACT[PATIENT_KEY] ),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG] = 1, TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Biogen spend
  description: This measure calculates the total patient benefit from the PHARMACY_CLAIMS_FACT
    table where the claim transaction type flag is 1. It applies a filter using the
    TREATAS function to match product brand names from the US_PRODUCT_MASTER table
    and adds 0 to ensure a numeric result.
  expression: "CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]), \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1 , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))\
    \ + 0"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: No. of claims
  description: This measure calculates the distinct count of claim authorization numbers
    from the PHARMACY_CLAIMS_FACT table where the claim transaction type flag is 1.
    It uses the TREATAS function to filter by product brand names from the US_PRODUCT_MASTER
    table.
  expression: 'CALCULATE(DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Patient Benefit
  description: This measure sums the patient benefit from the PHARMACY_CLAIMS_FACT
    table where the claim transaction type flag is 1. It applies a filter using the
    TREATAS function to match product brand names from the US_PRODUCT_MASTER table.
  expression: "CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]), \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ =1, TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))\
    \ \n"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Patient count
  description: This measure calculates the distinct count of member IDs from the PHARMACY_CLAIMS_FACT
    table where the claim transaction type flag is 1. It uses the TREATAS function
    to filter by product brand names from the US_PRODUCT_MASTER table.
  expression: CALCULATE(DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[MEMBERID]),PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]
    =1,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Biogen spend per claim
  description: This measure divides the total Biogen spend by the number of claims,
    providing the average spend per claim. It uses a default value of 0 to handle
    division by zero.
  expression: DIVIDE([Biogen spend],[No. of claims],0)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Biogen spend
  - No. of claims
- name: Biogen spend per patient
  description: This measure divides the total Biogen spend by the patient count, providing
    the average spend per patient. It uses a default value of 0 to handle division
    by zero.
  expression: DIVIDE([Biogen spend],[Patient count],0)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Biogen spend
  - Patient count
- name: Volume metrics
  description: This measure calculates either the number of claims or the patient
    count based on the selected value in the 'Volume Metric'[Column1]. It uses the
    'Volume Metric' table and applies a filter condition to check if 'Column1' is
    filtered and matches specific values.
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Volume Metric'[Column1])\
    \ && SELECTEDVALUE('Volume Metric'[Column1])=\"Claim Volume\",[No. of claims],\n\
    \                    ISFILTERED('Volume Metric'[Column1]) && SELECTEDVALUE('Volume\
    \ Metric'[Column1])=\"Patient Count\",[Patient count])"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
