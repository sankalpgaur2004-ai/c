- name: Median Months from Authorization to First Patient Enrollment
  description: The DAX expression calculates the median number of months between the
    authorization date and the first patient enrollment date. It uses the column [Enrollment-Authorized
    Date] from the table VW_RPT_COMS_CENTERS_HCO to determine the median duration
    in days, which is then divided by 30 to convert it into months. Filters can be
    applied to this measure based on any context or slicers affecting the VW_RPT_COMS_CENTERS_HCO
    table, such as specific centers, time periods, or other relevant dimensions.
  expression: 'var a = MEDIAN(VW_RPT_COMS_CENTERS_HCO[Enrollment-Authorized Date])

    var b = DIVIDE(a, 30,0)

    RETURN b'
  assigned_table: Measures Table
  page_group: ''
  dependent_measures: []
- name: Phone Metric Data
  description: The DAX expression calculates the most recent date from the `DATA_AS_OF`
    column in the `VW_SOURCE_FILES_TRACK` table, specifically for records where the
    `SOURCE` column is "Five9" and the `FILE_NAME` column is "Phone_Metrics". It then
    formats this date as "DD MMMM YYYY" followed by a comma. The calculation is filtered
    to only include entries that match these specific criteria for the `SOURCE` and
    `FILE_NAME` columns.
  expression: 'var a = CALCULATE(MAX(VW_SOURCE_FILES_TRACK[DATA_AS_OF]), VW_SOURCE_FILES_TRACK[SOURCE]
    ="Five9", VW_SOURCE_FILES_TRACK[FILE_NAME]="Phone_Metrics")

    RETURN FORMAT(a, "DD MMMM YYYY")&","'
