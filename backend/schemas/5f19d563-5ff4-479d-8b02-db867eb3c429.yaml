- name: Wave 1
  description: The DAX expression calculates the proportion of distinct center records
    associated with "Wave 1" interactions over the total distinct center records for
    "Wave 1." It uses the `VW_RPT_COMS_INTERACTIONS` table to determine the date range
    and count of distinct `CENTER_RECORD_ID` values, and the `VW_RPT_COMS_CENTERS_HCO`
    table to count distinct `RECORD_ID` values. The calculation applies filters for
    the "Wave 1" identifier and considers all dates by removing any existing date
    filters using `ALL()` on the `VW_RPT_CALENDAR` table.
  expression: 'var a = CALCULATE(MIN(VW_RPT_COMS_INTERACTIONS[INTERACTION_DATE]),
    ALL())

    var b = MAX(VW_RPT_COMS_INTERACTIONS[INTERACTION_DATE])

    var c =

    CALCULATE(DISTINCTCOUNT(VW_RPT_COMS_INTERACTIONS[CENTER_RECORD_ID]), VW_RPT_COMS_INTERACTIONS[WAVE_IDENTIFIER]="Wave
    1", DATESBETWEEN(VW_RPT_COMS_INTERACTIONS[INTERACTION_DATE], a,b), ALL(VW_RPT_CALENDAR))

    var d = CALCULATE(DISTINCTCOUNT(VW_RPT_COMS_CENTERS_HCO[RECORD_ID]), VW_RPT_COMS_CENTERS_HCO[WAVE_IDENTIFIER]="Wave
    1", ALL(VW_RPT_CALENDAR))


    var e = DIVID'
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
