  description: The DAX expression calculates the cumulative count of distinct related
    contacts from the `VW_RPT_COMS_INTERACTIONS` table, considering interaction dates
    from the earliest to the latest available in the dataset. It uses the `INTERACTION_DATE`
    and `RELATED_CONTACT` columns from the `VW_RPT_COMS_INTERACTIONS` table and the
    `RECORD_ID` column from the `VW_RPT_COMS_CONTACTS_HCP` table. The calculation
    removes any filters from the `VW_RPT_CALENDAR` table, allowing it to consider
    all dates within the specified range, but it does not apply any additional filters
