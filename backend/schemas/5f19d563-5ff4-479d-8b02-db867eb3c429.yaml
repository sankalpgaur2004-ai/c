- name: New Prescribers
  description: The DAX expression calculates the number of distinct healthcare providers
    (HCPs) who are identified as new prescribers. It uses the `VW_RPT_DIM_PATIENT`
    table, specifically the `HCP_NAME` and `NEW_PRESCRIBER_FLAG` columns. The calculation
    is filtered to include only those records where the `NEW_PRESCRIBER_FLAG` is equal
    to "Y". If no such records exist, the measure returns 0 instead of a blank value.
  expression: 'var a = CALCULATE(DISTINCTCOUNT(VW_RPT_DIM_PATIENT[HCP_NAME]), VW_RPT_DIM_PATIENT[NEW_PRESCRIBER_FLAG]="Y")

    RETURN IF(a=BLANK(),0,a)'
  assigned_table: Measures Table
  page_group: ''
  dependent_measures: []
- name: Repeating Prescribers
  description: The DAX expression calculates the number of healthcare providers who
    have prescribed medication to patients but are not considered new prescribers.
    It uses the `VW_RPT_DIM_PATIENT` table, specifically the `HCP_NAME` and `NEW_PRESCRIBER_FLAG`
    columns. The measure applies filters to differentiate between new and existing
    prescribers, identifying those who have prescribed before but are not flagged
    as new prescribers.
  expression: "VAR a = CALCULATETABLE(\n    VALUES(VW_RPT_DIM_PATIENT[HCP_NAME]),\n\
    \    VW_RPT_DIM_PATIENT[NEW_PRESCRIBER_FLAG] = \"N\"\n)\nVAR b = CALCULATETABLE(\n\
    \    VALUES(VW_RPT_DIM_PATIENT[HCP_NAME]),\n    VW_RPT_DIM_PATIENT[NEW_PRESCRIBER_FLAG]\
    \ = \"Y\"\n)\nVAR c = EXCEPT(a, b)\nRETURN COUNTROWS(c)"
  assigned_table: Measures Table
  page_group: ''
  dependent_measures: []
- name: QBR Register in Portal
  description: The DAX expression calculates the distinct count of patient IDs from
    the `VW_RPT_DIM_PATIENT` table. It ensures that if the count is blank, it returns
    zero instead. The result is only returned if the `Stages` table contains an entry
    with an `Index` value of 1; otherwise, it returns blank. The calculation is influenced
    by any filters applied to the `Stages` table, specifically on the `Index` column.
  expression: "var a = CALCULATE(DISTINCTCOUNT(VW_RPT_DIM_PATIENT[SRC_PATIENT_ID]))\n\
    \ var b = IF(a=BLANK(),0,a)\n RETURN IF(CONTAINS(Stages, Stages[Index],1),b,BLANK())"
  assigned_table: Measures Table
  page_group: ''
  dependent_measures: []
- name: QBR Schedule for Apheresis
  description: The DAX expression calculates the distinct count of patient IDs from
    the `VW_RPT_DIM_PATIENT` table where the apheresis scheduled date is not blank
    and matches the calendar dates from the `VW_RPT_CALENDAR` table. It uses the `SRC_PATIENT_ID`
    and `APHERESIS_SCHEDULED_DATE` columns from the `VW_RPT_DIM_PATIENT` table and
    the `CAL_DATE` column from the `VW_RPT_CALENDAR` table. The measure applies a
    filter to only return the count when the `Stages[Index]` equals 3, and it removes
    any filters from the `VW_RPT_CALENDAR` table.
  expression: "var a =CALCULATE(DISTINCTCOUNT(VW_RPT_DIM_PATIENT[SRC_PATIENT_ID]),NOT(ISBLANK(VW_RPT_DIM_PATIENT[APHERESIS_SCHEDULED_DATE])),\
    \ TREATAS(VALUES(VW_RPT_CALENDAR[CAL_DATE]), VW_RPT_DIM_PATIENT[APHERESIS_SCHEDULED_DATE]),\
    \ REMOVEFILTERS(VW_RPT_CALENDAR))\n var b = IF(a=BLANK(),0,a)\n RETURN IF(CONTAINS(Stages,\
    \ Stages[Index],3),b,BLANK())"
  assigned_table: Measures Table
  page_group: ''
  dependent_measures: []
- name: Monday Data
