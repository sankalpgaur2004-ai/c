    VW_FACT_MARKET_ACCESS_QUALITY_OF_ACCESS[BRAND]="Aucatzyl",VW_FACT_MARKET_ACCESS_QUALITY_OF_ACCESS[COVERAGE_BASED_ON_GENERAL_&_PRODUCT-SPECIFIC_POLICIES]=
