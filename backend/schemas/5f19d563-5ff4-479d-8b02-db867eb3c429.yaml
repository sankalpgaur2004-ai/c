- name: Table
  description: The table contains information about various project milestones, each
    represented by a "Value" and associated with an "Index" number. It also includes
    details about the "PSP" (Project Specific Parameter) which indicates the level
    of amount (Maximum, Average, Minimum) and the "Market Access Category" which specifies
    the category or product related to each milestone.
  columns:
  - name: Value
    type: Text
    sample_values:
    - Kickoff Completed
    - Enrolled >=1 Patient
    - Agreements Completed
    - IT Security Assessment Completed
    - Reached Pre-Activation Threshold (80%)
    description: The 'Value' column contains text descriptions of various project
      statuses or milestones.
  - name: Index
    type: Integer
    sample_values:
    - '3'
    - '4'
    - '6'
    - '2'
    - '1'
    description: The 'Index' column contains integer values representing the order
      or position of items in a sequence.
  - name: PSP
    type: Text
    sample_values:
    - Maximum Amount
    - Average Amount
    - b
    - a
    - e
    description: The 'PSP' column includes text entries that describe different types
      of financial or statistical measures.
  - name: Market Access Category
