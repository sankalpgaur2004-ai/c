    ALL())

    var b = CALCULATE(MAX(VW_RPT_COMS_INTERACTIONS[INTERACTION_DATE]))

    var c =

    CALCULATE(DISTINCTCOUNT(VW_RPT_COMS_INTERACTIONS[RELATED_CONTACT]),  DATESBETWEEN(VW_RPT_COMS_INTERACTIONS[INTERACTION_DATE],
    a,b), REMOVEFILTERS(VW_RPT_CALENDAR))

    var d = CALCULATE(DISTINCTCOUNT(VW_RPT_COMS_CONTACTS_HCP[RECORD_ID]),  ALL(VW_RPT_CALENDAR))


