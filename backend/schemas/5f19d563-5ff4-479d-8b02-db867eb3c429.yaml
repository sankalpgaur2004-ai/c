- name: VW_RPT_COMS_CONTACTS_HCP
  description: The table "VW_RPT_COMS_CONTACTS_HCP" contains detailed information
    about healthcare professionals (HCPs) and their interactions with Autolus, a biopharmaceutical
    company. It includes columns such as NPI numbers, contact names, roles, contact
    types, and various attributes related to their professional activities and affiliations,
    such as social media presence, treatment philosophy, and involvement in advisory
    boards or as speakers. Additionally, it tracks metadata like creation and modification
    dates, record ownership, and regional assignments.
