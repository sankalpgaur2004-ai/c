measures:
- name: Avg months from Activation to Authorization
  description: The DAX expression calculates the average number of months from when
    a center reaches the activation threshold to when it is authorized. It uses the
    `VW_RPT_COMS_CENTERS_HCO` table, specifically the columns `Authorized Date- Max
    Date`, `CENTER_ID`, and `CURRENT_MILESTONE`. The calculation is filtered to include
    only those records where the `CURRENT_MILESTONE` is "Authorized". The result is
    formatted to show the average duration in months.
  expression: 'var a = CALCULATE(SUM(VW_RPT_COMS_CENTERS_HCO[Authorized Date- Max
    Date]))

    var b = CALCULATE(DISTINCTCOUNT(VW_RPT_COMS_CENTERS_HCO[CENTER_ID]), VW_RPT_COMS_CENTERS_HCO[CURRENT_MILESTONE]="Authorized")

    var c = a/b

    var d = c/30

    RETURN d

    --"Average months from Activation Threshold Reached (80%) to Authorization = "
    & FORMAT(d, "#.#") & " Months"'
  assigned_table: VW_RPT_COMS_CENTERS_HCO
  page_group: ''
  dependent_measures: []
- name: Refresh Data
  description: The DAX expression calculates the most recent date from the 'RefreshDate'
    column in the 'Latest Refresh Date' table and formats it as a string in the "dd
    MMMM YYYY" format. It utilizes the MAX function to determine the latest date available
    in the specified column. This measure does not inherently include any filters,
    but it can be affected by external filters applied to the 'Latest Refresh Date'
    table or its context within a report.
  expression: FORMAT(MAX('Latest Refresh Date'[RefreshDate]), "dd MMMM YYYY")
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: COMS Data Date
  description: The DAX expression calculates the most recent date from the `FILE_DATE`
    column in the `VW_RPT_COMS_CONTACTS_HCP` table and formats it as a string in the
    "dd MMMM YYYY" format. It uses the `MAX` function to determine the latest date
    available in the specified column. This measure can be influenced by any filters
    applied to the `VW_RPT_COMS_CONTACTS_HCP` table, which may affect the range of
    dates considered for determining the maximum date.
  expression: FORMAT(MAX(VW_RPT_COMS_CONTACTS_HCP[FILE_DATE]), "dd MMMM YYYY")
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: Center Name
  description: The DAX expression concatenates all the values from the column `CENTER_NAME`
    in the table `VW_RPT_COMS_CENTERS_HCO`, separating each value with a comma and
    a space. It utilizes the `CONCATENATEX` function to achieve this aggregation.
    The result can be influenced by any filters applied to the `VW_RPT_COMS_CENTERS_HCO`
    table, which would limit the rows considered in the concatenation process.
  expression: CONCATENATEX(VW_RPT_COMS_CENTERS_HCO, VW_RPT_COMS_CENTERS_HCO[CENTER_NAME],
    ", ")
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: Center ID
  description: The DAX expression concatenates the values from the column `[DISPLAY_CENTER_ID]`
    in the table `VW_RPT_COMS_CENTERS_HCO`, separating each value with a comma and
    a space. It uses the `CONCATENATEX` function to achieve this, iterating over all
    rows in the specified column. The result can be influenced by any filters applied
    to the `VW_RPT_COMS_CENTERS_HCO` table, which would limit the rows considered
    in the concatenation process.
  expression: CONCATENATEX(VW_RPT_COMS_CENTERS_HCO, VW_RPT_COMS_CENTERS_HCO[DISPLAY_CENTER_ID],
    ", ")
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: Authorized
  description: The DAX expression calculates the distinct count of 'RECORD_ID' from
    the 'VW_RPT_COMS_CENTERS_HCO' table, specifically for entries where the 'AUTOLUS_US_REGION'
    is not "Test Region" and the 'CURRENT_MILESTONE' is "Authorized". It uses the
    'VW_RPT_COMS_CENTERS_HCO' table and the columns 'RECORD_ID', 'AUTOLUS_US_REGION',
    and 'CURRENT_MILESTONE'. The result is returned as "0" if the count is zero; otherwise,
    it returns the count itself.
  expression: 'var a = CALCULATE(DISTINCTCOUNT(''VW_RPT_COMS_CENTERS_HCO''[RECORD_ID]),FILTER(VW_RPT_COMS_CENTERS_HCO,
    VW_RPT_COMS_CENTERS_HCO[AUTOLUS_US_REGION]<>"Test Region"),''VW_RPT_COMS_CENTERS_HCO''[CURRENT_MILESTONE]="Authorized")

    return IF(a=0,"0",a)'
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: Drop-Offs / Cancelled
  description: This DAX expression calculates the distinct count of patient IDs from
    the table `VW_RPT_DIM_PATIENT` where the patient status is "Canceled." It uses
    the columns `SRC_PATIENT_ID` and `SRC_PATIENT_STATUS` from the `VW_RPT_DIM_PATIENT`
    table. The measure applies a filter to include only those records where the `SRC_PATIENT_STATUS`
    is "Canceled," and if the result is blank, it returns 0 instead.
  expression: 'var a = CALCULATE(DISTINCTCOUNT(VW_RPT_DIM_PATIENT[SRC_PATIENT_ID]),
    VW_RPT_DIM_PATIENT[SRC_PATIENT_STATUS]="Canceled")

    RETURN IF(a=BLANK(),0,a)'
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: QBR Avg Tat Registration to Apheresis
  description: The DAX expression calculates the median turnaround time for the phase
    "Registration to Apheresis" over a rolling three-month period, rounding the result
    to the nearest whole number. It uses data from the `VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED`
    table, specifically the `PHASE_TAT`, `PERIOD_TYPE`, and `METRIC_NAME` columns.
    The measure applies filters to include only records where `PERIOD_TYPE` is "ROLLING
    3 MONTHS" and `METRIC_NAME` is "Registration to Apheresis," and it returns the
    calculated value only if the `Stages` table contains an index of 1.
  expression: "Var a = ROUND(CALCULATE(MEDIAN(VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[PHASE_TAT]),\
    \ VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[PERIOD_TYPE]=\"ROLLING\
    \ 3 MONTHS\",  VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[METRIC_NAME]=\"\
    Registration to Apheresis\"),0)\n var b = IF(a=BLANK(),0,a)\n RETURN IF(CONTAINS(Stages,\
    \ Stages[Index],1),b,BLANK())"
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: Avg Tat QA release to Receipt at CAR T Center
  description: The DAX expression calculates the median of the "PHASE_TAT" column
    from the "VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED" table, specifically
    for entries where the "PERIOD_TYPE" is "ROLLING 3 MONTHS" and the "METRIC_NAME"
    is "QA release to receipt at CAR T center." The result is rounded to the nearest
    whole number, and if the calculated median is blank, it returns 0 instead. Filters
    applied include the specified period type and metric name.
  expression: 'Var a =ROUND( CALCULATE(MEDIAN(VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[PHASE_TAT]),
    VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[PERIOD_TYPE]="ROLLING 3
    MONTHS",  VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[METRIC_NAME]="QA
    release to receipt at CAR T center"),0)

    RETURN  IF(a=BLANK(),0,a)'
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: Avg Tat Nucleus to Tx Center
  description: The DAX expression calculates the median of the "Date Diff Nucleus
    to Tx Center" column from the "VW_RPT_DIM_PATIENT" table. If the median value
    is blank, it returns 0; otherwise, it returns the median value itself. This measure
    can be influenced by any filters applied to the "VW_RPT_DIM_PATIENT" table, particularly
    those affecting the "Date Diff Nucleus to Tx Center" column.
  expression: 'var a = MEDIAN(VW_RPT_DIM_PATIENT[Date Diff Nucleus to Tx Center])

    RETURN IF(a=BLANK(),0,a)'
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: QBR Avg TAT Aph to Infusion
  description: The measure calculates the median turnaround time for the phase from
    apheresis to infusion with dose 1, specifically over a rolling 3-month period.
    It uses the `VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED` table, focusing
    on the `PHASE_TAT`, `PERIOD_TYPE`, and `METRIC_NAME` columns. The result is rounded
    to the nearest whole number, and if the median is blank, it defaults to zero.
    Additionally, the measure only returns a value if the `Stages` table contains
    an entry with an `Index` of 7; otherwise, it returns blank.
  expression: "Var a = ROUND(CALCULATE(MEDIAN(VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[PHASE_TAT]),\
    \ VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[PERIOD_TYPE]=\"ROLLING\
    \ 3 MONTHS\",  VW_RPT_FACT_PATIENT_JOURNEY_TURN_AROUND_TIME_DETAILED[METRIC_NAME]=\"\
    Apheresis to Infusion with Dose 1\"),0)\n var b = IF(a=BLANK(),0,a)\n RETURN IF(CONTAINS(Stages,\
    \ Stages[Index],7),b,BLANK())"
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
- name: Avg months from Kick Off to Authorization
  description: The DAX expression calculates the average number of months between
    the "Kick off" and "Authorization" dates for centers, using the "VW_RPT_COMS_CENTERS_HCO"
    table. It sums the total days between these two events for all centers, counts
    the distinct centers with non-blank values for this duration, and then divides
    the total days by the count of centers and further by 30 to convert days into
    months. The calculation can be influenced by any filters applied to the "VW_RPT_COMS_CENTERS_HCO"
    table, particularly those affecting the "CENTER_ID" or the "Kick off - Authorized"
    column.
  expression: 'var a = SUM(VW_RPT_COMS_CENTERS_HCO[Kick off - Authorized])

    var b = CALCULATE(DISTINCTCOUNT(VW_RPT_COMS_CENTERS_HCO[CENTER_ID]), NOT(ISBLANK(VW_RPT_COMS_CENTERS_HCO[Kick
    off - Authorized])))

    var c = a/b

    var d = c/30

    RETURN d'
  assigned_table: Latest Refresh Date
  page_group: ''
  dependent_measures: []
