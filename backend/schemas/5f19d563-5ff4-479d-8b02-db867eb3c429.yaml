  expression: 'var a = CALCULATE(MAX(VW_SOURCE_FILES_TRACK[DATA_AS_OF]),VW_SOURCE_FILES_TRACK[FILE_NAME]="MANUFACTURING",VW_SOURCE_FILES_TRACK[SOURCE]="MONDAY")

