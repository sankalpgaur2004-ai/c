report_name: Bridge Bio Chart
tables:
- name: Org List
  description: The "Org List" table contains information about employees within an
    organization, including their names, email addresses, departments, phone numbers,
    job titles, and their reporting managers. It provides a structured overview of
    the organizational hierarchy and contact details, particularly focusing on the
    manufacturing department.
  columns:
  - name: Name
    type: string
    sample_values:
    - Alex Nichols
    - Renee Cramer
    - Preety Sahdev
    - Leena Prasad
    - Sree Cheboyina
    description: The Name column contains the full names of individuals in the organization.
  - name: Email
    type: string
    sample_values:
    - Alex.Nichols@bridgebio.com
    - renee.cramer@bridgebio.com
    - preety.sahdev@bridgebio.com
    - Leena.Prasad@BridgeBio.com
    - Sree.Cheboyina@bridgebio.com
    description: The Email column provides the professional email addresses of the
      individuals.
  - name: Department
    type: string
    sample_values:
    - 115 - Manufacturing
    - 106 - Clinical Operations
    - 515 - Human Resources
    - 525 - Facility
    - 150 - Business Dev & Operations
    description: The Department column indicates the specific department and its code
      where the individual works.
  - name: Phone
    type: string
    sample_values: []
    description: The Phone column is intended to store personal phone numbers of the
      individuals, but currently has no data.
  - name: Work Phone
    type: string
    sample_values: []
    description: The Work Phone column is meant to hold the work phone numbers of
      the individuals, but currently has no data.
  - name: Job Title
