- name: Bottles with copay redemption
  description: The DAX expression calculates the total quantity of pharmacy claims
    where the claim transaction type is flagged as 1, indicating a copay redemption.
    It uses the `PHARMACY_CLAIMS_FACT` table, specifically the `QUANTITY` and `CLAIM_TRANSACTION_TYPE_FLG`
    columns, and the `US_PRODUCT_MASTER` table's `PRODUCT_BRAND_NAME` column. The
    calculation is filtered by matching the brand names from the `US_PRODUCT_MASTER`
    table to the `BRANDNAME` column in the `PHARMACY_CLAIMS_FACT` table using the
    `TREATAS` function.
  expression: "CALCULATE(SUM(PHARMACY_CLAIMS_FACT[QUANTITY]),\nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1\
    \  \n,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Total copay support
  description: The DAX expression calculates the total patient benefit by summing
    the values in the "PATIENTBENEFIT" column from the "PHARMACY_CLAIMS_FACT" table.
    It applies a filter where the "CLAIM_TRANSACTION_TYPE_FLG" column equals 1, indicating
    a specific type of claim transaction. Additionally, it uses the TREATAS function
    to apply a filter based on the "PRODUCT_BRAND_NAME" from the "US_PRODUCT_MASTER"
    table, matching it with the "BRANDNAME" column in the "PHARMACY_CLAIMS_FACT" table.
  expression: 'CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1, TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Average copay support
  description: The DAX expression calculates the average patient benefit for pharmacy
    claims where the claim transaction type flag is equal to 1. It uses the `PHARMACY_CLAIMS_FACT`
    table, specifically the `CLAIM_TRANSACTION_TYPE_FLG` and `PATIENTBENEFIT` columns,
    and applies a filter to include only those records that match the product brand
    names from the `US_PRODUCT_MASTER` table. The filter applied is based on the brand
    name, ensuring that only claims associated with specific product brand names are
    considered in the calculation.
  expression: "CALCULATE(AVERAGEX(FILTER(PHARMACY_CLAIMS_FACT, \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1),\n\
    PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))"
