- name: Clm type
  description: The "Clm type" table contains information about different types of
    claims, as indicated by the "CLAIM_TYPE" column. Each row in the table represents
    a specific claim type, such as "PHARMACY" or "MEDICAL," which categorizes the
    nature of the claim. This table is likely used to classify and manage claims based
    on their type for further processing or analysis.
