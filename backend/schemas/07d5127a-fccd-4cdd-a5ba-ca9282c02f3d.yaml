    numbers from the `PHARMACY_CLAIMS_FACT` table, specifically for claims where the
    transaction type flag equals 1. It utilizes columns from both the `PHARMACY_CLAIMS_FACT`
    table and the `US_PRODUCT_MASTER` table, specifically the `CLAIMAUTHORIZATIONNUMBER`,
    `CLAIM_TRANSACTION_TYPE_FLG`, and `BRANDNAME` columns. The calculation is filtered
    by matching the product brand names from the `US_PRODUCT_MASTER` table to the
    brand names in the `PHARMACY_CLAIMS_FACT` table using the `TREATAS` function.
  expression: 'CALCULATE(DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Patient Benefit
  description: The DAX expression calculates the total patient benefit from pharmacy
    claims where the claim transaction type is flagged as 1. It uses the `PHARMACY_CLAIMS_FACT`
    table, specifically the `PATIENTBENEFIT` and `CLAIM_TRANSACTION_TYPE_FLG` columns,
    and the `US_PRODUCT_MASTER` table's `PRODUCT_BRAND_NAME` column. The calculation
    is filtered by matching the brand names from the `US_PRODUCT_MASTER` table to
    the `BRANDNAME` column in the `PHARMACY_CLAIMS_FACT` table using the `TREATAS`
    function.
  expression: "CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT]), \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ =1, TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Patient count
  description: The DAX expression calculates the distinct count of unique member IDs
    from the `PHARMACY_CLAIMS_FACT` table, specifically for records where the `CLAIM_TRANSACTION_TYPE_FLG`
    is equal to 1. It also applies a filter using the `TREATAS` function, which aligns
    the values of `PRODUCT_BRAND_NAME` from the `US_PRODUCT_MASTER` table with the
    `BRANDNAME` column in the `PHARMACY_CLAIMS_FACT` table. This measure can be further
    filtered by any context applied to the `US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]`
    values.
  expression: CALCULATE(DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[MEMBERID]),PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]
    =1,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Biogen spend per claim
  description: 'The DAX expression calculates the average amount of Biogen spend per
    claim by dividing the total Biogen spend by the number of claims. It utilizes
    two measures: one representing the total Biogen spend and another representing
    the total number of claims. The calculation can be influenced by any filters applied
    to the data model that affect these measures, such as date ranges, geographical
    regions, or specific product categories, depending on the structure of the underlying
    data model.'
  expression: DIVIDE([Biogen spend],[No. of claims],0)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Biogen spend
  - No. of claims
- name: Biogen spend per patient
  description: 'The DAX expression calculates the average spending by Biogen per patient
    by dividing the total Biogen spend by the patient count, with a fallback to zero
    if the patient count is zero. It utilizes two measures: one for the total Biogen
    spend and another for the patient count. The calculation can be influenced by
    any filters applied to the data model that affect these measures, such as date
    ranges, geographical regions, or specific patient demographics, depending on how
    the underlying data is structured and related.'
  expression: DIVIDE([Biogen spend],[Patient count],0)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Biogen spend
  - Patient count
- name: Volume metrics
  description: The DAX expression calculates either the number of claims or the patient
    count based on the selected value in the 'Volume Metric'[Column1]. It utilizes
    the 'Volume Metric' table and specifically the 'Column1' within that table to
    determine which metric to display. The calculation is influenced by filters applied
    to 'Volume Metric'[Column1], specifically when it is filtered to "Claim Volume"
    or "Patient Count".
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Volume Metric'[Column1])\
    \ && SELECTEDVALUE('Volume Metric'[Column1])=\"Claim Volume\",[No. of claims],\n\
    \                    ISFILTERED('Volume Metric'[Column1]) && SELECTEDVALUE('Volume\
    \ Metric'[Column1])=\"Patient Count\",[Patient count])"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - No. of claims
  - Patient count
- name: Volume metrics header
  description: The DAX expression evaluates the context of the 'Volume Metric'[Column1]
    and returns either "Claim Volume" or "Patient Count" based on the selected value
    within that column. It utilizes the 'Volume Metric' table and specifically the
    'Column1' within that table. The measure is influenced by filters applied to 'Volume
    Metric'[Column1], allowing it to dynamically return a result based on whether
    "Claim Volume" or "Patient Count" is selected.
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Volume Metric'[Column1])\
    \ && SELECTEDVALUE('Volume Metric'[Column1])=\"Claim Volume\",\"Claim Volume\"\
    ,\n                    ISFILTERED('Volume Metric'[Column1]) && SELECTEDVALUE('Volume\
    \ Metric'[Column1])=\"Patient Count\",\"Patient Count\")"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Spend metrics
  description: 'The DAX expression calculates different spend metrics based on the
    selected value in the ''Spend Metric''[Column1] column. It uses the ''Spend Metric''
    table and specifically the ''Column1'' column to determine which metric to return:
    total Biogen spend, Biogen spend per patient, or Biogen spend per claim. The calculation
    is influenced by filters applied to ''Spend Metric''[Column1], allowing it to
    dynamically switch between the specified metrics based on the user''s selection.'
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Spend Metric'[Column1])\
    \ && SELECTEDVALUE('Spend Metric'[Column1])=\"Total Biogen Spend\",[Biogen spend],\n\
    \                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend per Patient\",[Biogen spend per patient],\n\
    \                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend Per Claim\",[Biogen spend per claim])"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Biogen spend
  - Biogen spend per claim
  - Biogen spend per patient
- name: Spend metrics header
  description: 'The DAX expression evaluates the value in the ''Spend Metric''[Column1]
    and returns a corresponding label based on the selected value. It uses the ''Spend
    Metric'' table and specifically the ''Column1'' within that table. The measure
    applies filters based on whether ''Column1'' is filtered and matches one of the
    specified values: "Total Biogen Spend," "Biogen Spend per Patient," or "Biogen
    Spend Per Claim."'
  expression: "SWITCH(TRUE(),\n                    ISFILTERED('Spend Metric'[Column1])\
    \ && SELECTEDVALUE('Spend Metric'[Column1])=\"Total Biogen Spend\",\"Total Biogen\
    \ Spend\",\n                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend per Patient\",\"Biogen Spend per Patient\"\
    ,\n                    ISFILTERED('Spend Metric'[Column1]) && SELECTEDVALUE('Spend\
    \ Metric'[Column1])=\"Biogen Spend Per Claim\",\"Biogen Spend Per Claim\")"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Total Patient Benefit (MAXIMIZER)
  description: The DAX expression calculates the total sum of the "PATIENTBENEFIT"
    column from the "MAXIMIZER_SPEND" table. It uses the "PRODUCT_BRAND_NAME" column
    from the "US_PRODUCT_MASTER" table to filter the "BRANDNAME" column in the "MAXIMIZER_SPEND"
    table by applying the values from the former to the latter. This measure can be
    influenced by any filters applied to the "PRODUCT_BRAND_NAME" in the "US_PRODUCT_MASTER"
    table, as these will affect the values used in the TREATAS function.
  expression: "CALCULATE(\n    SUM ( MAXIMIZER_SPEND[PATIENTBENEFIT] )\n    , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),MAXIMIZER_SPEND[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Patient_count_pharmacy
  description: The DAX expression calculates the distinct count of claim authorization
    numbers from the 'PHARMACY_CLAIMS_FACT' table, specifically for records where
    the claim transaction type flag equals 1. It uses the 'CLAIMAUTHORIZATIONNUMBER'
    and 'CLAIM_TRANSACTION_TYPE_FLG' columns from the 'PHARMACY_CLAIMS_FACT' table
    and applies a filter using the 'PRODUCT_BRAND_NAME' from the 'US_PRODUCT_MASTER'
    table, matching it to the 'BRANDNAME' column in the 'PHARMACY_CLAIMS_FACT' table
    through the TREATAS function. This measure can be filtered by the product brand
    names present in the 'US_PRODUCT_MASTER' table.
  expression: "CALCULATE(DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]),\
    \ \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG] = 1,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Successful_Claim_PAT
  description: The DAX expression calculates the count of distinct member IDs from
    the 'PHARMACY_CLAIMS_FACT' table where the 'CLAIM_TRANSACTION_TYPE_FLG' is equal
    to 1, indicating successful claims. It utilizes columns from the 'PHARMACY_CLAIMS_FACT'
    table, specifically 'MEMBERID', 'CLAIM_TRANSACTION_TYPE_FLG', and 'BRANDNAME',
    and applies a filter using the 'PRODUCT_BRAND_NAME' values from the 'US_PRODUCT_MASTER'
    table through the TREATAS function. The calculation is filtered by both the claim
    transaction type and the brand name, aligning the brand names from the 'US_PRODUCT_MASTER'
    table with those in the 'PHARMACY_CLAIMS_FACT' table.
  expression: "CALCULATE(COUNT(PHARMACY_CLAIMS_FACT[MEMBERID]), \nPHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,\
    \ TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Quantity redeemption
  description: The DAX expression calculates the total quantity from the 'PHARMACY_CLAIMS_FACT'
    table where the 'CLAIM_TRANSACTION_TYPE_FLG' is equal to 1. It uses a specific
    relationship between the 'DATE_DIM_ENR' table's 'DATE' column and the 'DATEOFFILL'
    column in the 'PHARMACY_CLAIMS_FACT' table. Additionally, it applies a filter
    using the 'PRODUCT_BRAND_NAME' values from the 'US_PRODUCT_MASTER' table to match
    the 'BRANDNAME' in the 'PHARMACY_CLAIMS_FACT' table.
  expression: 'CALCULATE(SUM(PHARMACY_CLAIMS_FACT[QUANTITY]),PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1,

    USERELATIONSHIP(''DATE_DIM_ENR''[DATE],PHARMACY_CLAIMS_FACT[DATEOFFILL]) , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrolled Claimed Within 6M
  description: The DAX expression calculates the distinct count of members from the
    IQV_ENROLLMENT_DIM table who have at least one pharmacy claim within 180 days
    of enrollment, where the claim transaction type is flagged as 1. It utilizes columns
    from the IQV_ENROLLMENT_DIM and PHARMACY_CLAIMS_FACT tables, specifically MEMBERID,
    CLAIM_TRANSACTION_TYPE_FLG, and Days_Enrollment. Additionally, it applies a filter
    using the TREATAS function to match product brand names from the US_PRODUCT_MASTER
    table to the PHARMACY_CLAIMS_FACT table's BRANDNAME column.
  expression: "CALCULATE(\n        DISTINCTCOUNT( IQV_ENROLLMENT_DIM[MEMBERID] ),\n\
    \        FILTER(\n            IQV_ENROLLMENT_DIM,\n            CALCULATE(\n  \
    \              COUNTROWS( PHARMACY_CLAIMS_FACT ),\n                PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1,\n                PHARMACY_CLAIMS_FACT[Days_Enrollment] >= 0,\n        \
    \        PHARMACY_CLAIMS_FACT[Days_Enrollment] <= 180\n            ) > 0\n   \
    \     ), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    \    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrolled Claimed After 6M
  description: The DAX expression calculates the distinct count of members from the
    IQV_ENROLLMENT_DIM table who have made at least one pharmacy claim transaction
    of type 1 more than 180 days after enrollment. It utilizes columns from the IQV_ENROLLMENT_DIM
    and PHARMACY_CLAIMS_FACT tables, specifically MEMBERID, CLAIM_TRANSACTION_TYPE_FLG,
    and Days_Enrollment. Additionally, it applies a filter using the TREATAS function
    to align product brand names from the US_PRODUCT_MASTER table with those in the
    PHARMACY_CLAIMS_FACT table, allowing for filtering based on product brand names.
  expression: "CALCULATE(\n        DISTINCTCOUNT( IQV_ENROLLMENT_DIM[MEMBERID] ),\n\
    \        FILTER(\n            IQV_ENROLLMENT_DIM,\n            CALCULATE(\n  \
    \              COUNTROWS( PHARMACY_CLAIMS_FACT ),\n                PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1,\n                PHARMACY_CLAIMS_FACT[Days_Enrollment] > 180\n        \
    \    ) > 0\n        ), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),\
    \ PHARMACY_CLAIMS_FACT[BRANDNAME])\n    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrolled But No Claims Till Date
  description: The DAX expression calculates the distinct count of members from the
    IQV_ENROLLMENT_DIM table who are enrolled in a product but have not made any claims
    to date. It uses columns from the IQV_ENROLLMENT_DIM table, specifically MEMBERID
    and BRANDNAME, and the PHARMACY_CLAIMS_FACT table, focusing on CLAIM_TRANSACTION_TYPE_FLG
    and BRANDNAME. The calculation applies filters to ensure that only those members
    are counted who have a claim transaction type flag of 1 and have not made any
    claims, while also aligning product brand names between the US_PRODUCT_MASTER
    and the other two tables using TREATAS.
  expression: "CALCULATE(DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID])\n,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),\n\
    \        IQV_ENROLLMENT_DIM[BRANDNAME]),\nFILTER(IQV_ENROLLMENT_DIM,\nCALCULATE(COUNTROWS(PHARMACY_CLAIMS_FACT),\n\
    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1)=0\n)\n,TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrollment Balance Check
  description: 'The "Enrollment Balance Check" measure calculates the difference between
    the total number of enrollments and the sum of enrollments that have been claimed
    within six months, claimed after six months, and those enrolled but with no claims
    to date. It utilizes the results of other measures: [Total enrollment], [Enrolled
    Claimed Within 6M], [Enrolled Claimed After 6M], and [Enrolled But No Claims Till
    Date], which likely derive their data from tables containing enrollment and claims
    information. Filters that can be applied to this measure would depend on the dimensions
    available in the data model, such as time periods, enrollment types, or demographic
    attributes, to refine the analysis.'
  expression: '[Total enrollment]     - [Enrolled Claimed Within 6M]     - [Enrolled
    Claimed After 6M]     - [Enrolled But No Claims Till Date]'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Total enrollment
  - Enrolled Claimed Within 6M
  - Enrolled Claimed After 6M
  - Enrolled But No Claims Till Date
- name: DATE_RELATION_CHECK
  description: The DAX expression calculates the total number of rows present in the
    table named `DATE_DIM_DOF`. It utilizes the entire `DATE_DIM_DOF` table without
    referencing any specific columns. The result can be influenced by any filters
    applied to the `DATE_DIM_DOF` table, such as date ranges or other criteria that
    limit the rows considered in the count.
  expression: COUNTROWS(DATE_DIM_DOF)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: 90th Percentile Claim Cost
  description: The DAX expression calculates the 90th percentile of the "PATIENTBENEFIT"
    values from the "PHARMACY_CLAIMS_FACT" table, specifically for records where the
    "CLAIM_TRANSACTION_TYPE_FLG" is equal to 1. It uses the "PHARMACY_CLAIMS_FACT"
    table and the "US_PRODUCT_MASTER" table, focusing on the "PATIENTBENEFIT" and
    "BRANDNAME" columns. The calculation is further refined by applying a filter that
    matches the "PRODUCT_BRAND_NAME" from the "US_PRODUCT_MASTER" table to the "BRANDNAME"
    in the "PHARMACY_CLAIMS_FACT" table using the TREATAS function.
  expression: "CALCULATE( PERCENTILEX.INC(\n            FILTER(\n                PHARMACY_CLAIMS_FACT,\n\
    \                PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG] = 1\n      \
    \      ),\n            PHARMACY_CLAIMS_FACT[PATIENTBENEFIT],\n            0.9\n\
    \        ),TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    \    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Claims ≥ 90th Percentile
  description: The DAX expression calculates the number of claims where the patient
    benefit is greater than or equal to the 90th percentile claim cost. It utilizes
    the `PHARMACY_CLAIMS_FACT` table, specifically the `PATIENTBENEFIT` column, and
    applies a filter using the `US_PRODUCT_MASTER` table's `PRODUCT_BRAND_NAME` column
    to match the `BRANDNAME` in the `PHARMACY_CLAIMS_FACT` table. The measure can
    be filtered by product brand names, allowing for analysis of claims distribution
    across different brands.
  expression: "VAR P90 =\n    [90th Percentile Claim Cost]\nRETURN\nCALCULATE(\n \
    \   [No. of claims],\n            PHARMACY_CLAIMS_FACT[PATIENTBENEFIT] >= P90\
    \ , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME])\n\
    )"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - No. of claims
  - 90th Percentile Claim Cost
- name: Rows With TREATAS
  description: The DAX expression calculates the number of rows in the `PHARMACY_CLAIMS_FACT`
    table where the `CLAIM_TRANSACTION_TYPE_FLG` is equal to 1 and the `BRANDNAME`
    column matches the distinct values from the `PRODUCT_BRAND_NAME` column in the
    `US_PRODUCT_MASTER` table. It utilizes the `COUNTROWS` function on the `PHARMACY_CLAIMS_FACT`
    table, applying a filter for transaction type and using `TREATAS` to align brand
    names between the two tables. Filters can be applied to the `PRODUCT_BRAND_NAME`
    column in the `US_PRODUCT_MASTER` table, affecting which brand names are considered
    in the calculation.
  expression: "CALCULATE(\n    COUNTROWS(PHARMACY_CLAIMS_FACT),\n    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1,\n    TREATAS(\n        VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),\n\
    \        PHARMACY_CLAIMS_FACT[BRANDNAME]\n    )\n)"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Rows Without TREATAS
  description: The DAX expression calculates the number of rows in the `PHARMACY_CLAIMS_FACT`
    table where the `CLAIM_TRANSACTION_TYPE_FLG` column has a value of 1. It utilizes
    the `COUNTROWS` function to count these specific rows within the `PHARMACY_CLAIMS_FACT`
    table. The calculation inherently applies a filter to include only those rows
    where the `CLAIM_TRANSACTION_TYPE_FLG` equals 1, but additional filters can be
    applied externally through the `CALCULATE` function context.
  expression: "CALCULATE(\n    COUNTROWS(PHARMACY_CLAIMS_FACT),\n    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]\
    \ = 1\n)"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Debug Filters
  description: The DAX expression concatenates distinct brand names from the `PHARMACY_CLAIMS_FACT`
    table into a single string, separated by commas. It utilizes the `BRANDNAME` column
    from the `PHARMACY_CLAIMS_FACT` table to achieve this. The result can be influenced
    by any filters applied to the `PHARMACY_CLAIMS_FACT` table, particularly those
    affecting the `BRANDNAME` column, such as filters on other columns within the
    same table or related tables that impact the context of the data.
  expression: "CONCATENATEX(\n    VALUES(PHARMACY_CLAIMS_FACT[BRANDNAME]),\n    PHARMACY_CLAIMS_FACT[BRANDNAME],\n\
    \    \", \"\n)"
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Distinct Members Visible
  description: The DAX expression calculates the number of unique member IDs from
    the `PHARMACY_CLAIMS_FACT` table where the `CLAIM_TRANSACTION_TYPE_FLG` column
    equals 1. It utilizes the `MEMBERID` and `CLAIM_TRANSACTION_TYPE_FLG` columns
    from the `PHARMACY_CLAIMS_FACT` table. The calculation is specifically filtered
    to include only those records where the claim transaction type flag is 1, and
    additional filters can be applied externally through the CALCULATE function context.
  expression: 'CALCULATE(

    DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[MEMBERID]), PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]
    = 1)'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: T.LAST UPDATE
  description: The DAX expression calculates the earliest date from the `LAST_UPDATED_DATE`
    column within the `PHARMACY_CLAIMS_FACT` table. It identifies the minimum value
    of the `LAST_UPDATED_DATE`, effectively providing the date of the oldest update
    recorded in the dataset. This calculation can be influenced by any filters applied
    to the `PHARMACY_CLAIMS_FACT` table, such as specific claim IDs, date ranges,
    or other relevant criteria that narrow down the dataset.
  expression: MIN(PHARMACY_CLAIMS_FACT[LAST_UPDATED_DATE])
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: T.Rows in Maximizer Spend
  description: The DAX expression calculates the total number of rows in the "MAXIMIZER_SPEND"
    table. It uses the entire "MAXIMIZER_SPEND" table without referencing any specific
    columns. Filters applied to this measure would depend on the context in which
    it is used, such as any slicers or filters applied in a report or visualization
    that affect the "MAXIMIZER_SPEND" table.
  expression: COUNTROWS(MAXIMIZER_SPEND)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
