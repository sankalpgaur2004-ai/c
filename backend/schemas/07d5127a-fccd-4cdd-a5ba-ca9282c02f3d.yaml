    pharmacies, including their unique identifiers, names, types, and specialties.
    It also includes metadata such as creation and last updated dates, status, and
    focus areas, along with identifiers like NPI and NCPDP numbers. The table is used
    to track pharmacy attributes and their affiliations with parent pharmacy groups.
