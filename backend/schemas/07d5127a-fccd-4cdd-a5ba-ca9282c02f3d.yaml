measures:
- name: Amount per claim
  description: The DAX expression calculates the average patient benefit amount per
    unique claim authorization number for pharmacy claims where the transaction type
    flag is 1. It uses the `PHARMACY_CLAIMS_FACT` table, specifically the `PATIENTBENEFIT`
    and `CLAIMAUTHORIZATIONNUMBER` columns, and applies a filter to include only those
    claims that match the product brand names from the `US_PRODUCT_MASTER` table.
    The calculation is filtered to consider only claims with a transaction type flag
    of 1 and is further refined by matching brand names between the two tables.
  expression: 'CALCULATE(SUM(PHARMACY_CLAIMS_FACT[PATIENTBENEFIT])/DISTINCTCOUNT(PHARMACY_CLAIMS_FACT[CLAIMAUTHORIZATIONNUMBER]),

    PHARMACY_CLAIMS_FACT[CLAIM_TRANSACTION_TYPE_FLG]=1 , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),PHARMACY_CLAIMS_FACT[BRANDNAME]))'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Last Updated
  description: The DAX expression calculates the most recent update time from the
    'LastRefresh' table by finding the maximum value in the 'UTC_Time' column and
    then adjusting it to Eastern Standard Time (EST) by subtracting 5 hours. It formats
    this adjusted time into a readable string format, displaying the date and time
    in "MMM dd, yyyy, hh:mm AM/PM" format. The calculation is based solely on the
    'LastRefresh[UTC_Time]' column, and any filters applied to this column or table
    will affect the result.
  expression: "VAR LastRefreshTime = MAX(LastRefresh[UTC_Time]) - TIME(5,0,0)\n \n\
    RETURN \"Last Updated: \" & FORMAT(LastRefreshTime, \"MMM dd, yyyy, hh:mm AM/PM\"\
    ) & \" EST\""
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Utilizing
  description: 'The measure calculates the number of enrolled individuals who have
    made at least one claim by subtracting the count of those enrolled but with no
    claims from the total enrollment. It relies on two other measures: [Total enrollment]
    and [Enrolled But No Claims Till Date], which likely aggregate data from tables
    containing enrollment and claims information. Filters can be applied based on
    dimensions related to enrollment and claims, such as time periods, demographic
    attributes, or specific enrollment programs, depending on the data model''s structure.'
  expression: '[Total enrollment] - [Enrolled But No Claims Till Date]'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Total enrollment
  - Enrolled But No Claims Till Date
- name: Total enrollment
  description: The DAX expression calculates the distinct count of member IDs from
    the IQV_ENROLLMENT_DIM table, effectively determining the total enrollment. It
    uses the MEMBERID column from the IQV_ENROLLMENT_DIM table and the PRODUCT_BRAND_NAME
    column from the US_PRODUCT_MASTER table. The calculation applies a filter by treating
    the values from the PRODUCT_BRAND_NAME column as if they were values in the BRANDNAME
    column of the IQV_ENROLLMENT_DIM table, allowing for filtering based on product
    brand names.
  expression: CALCULATE( DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID]), TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),IQV_ENROLLMENT_DIM[BRANDNAME]))
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Redemption Rate
  description: 'The DAX expression calculates the ratio of the number of utilizations
    to the total number of enrollments, effectively determining the proportion of
    enrolled entities that are being utilized. It uses two measures: [Utilizing] and
    [Total enrollment], which are likely derived from columns in the underlying data
    model, though the specific tables and columns are not explicitly mentioned in
    the expression. Filters can be applied to any dimensions or attributes related
    to the [Utilizing] and [Total enrollment] measures, allowing for analysis across
    different segments or categories within the data model.'
  expression: DIVIDE([Utilizing],[Total enrollment],0)
  assigned_table: Measure Table
  page_group: ''
  dependent_measures:
  - Utilizing
  - Total enrollment
- name: Enrollment from hub
  description: The DAX expression calculates the distinct count of member IDs from
    the IQV_ENROLLMENT_DIM table, specifically for enrollments made through the "HUB
    Portal" channel. It uses columns from the IQV_ENROLLMENT_DIM table, such as MEMBERID,
    ENROLLMENTCHANNEL, and BRANDNAME, and applies a filter that matches product brand
    names from the US_PRODUCT_MASTER table to the BRANDNAME column in the IQV_ENROLLMENT_DIM
    table using the TREATAS function. The measure can be filtered by product brand
    names from the US_PRODUCT_MASTER table and is inherently filtered to only include
    enrollments from the "HUB Portal."
  expression: 'CALCULATE(DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID]),

    IQV_ENROLLMENT_DIM[ENROLLMENTCHANNEL]="HUB Portal" , TREATAS(VALUES(US_PRODUCT_MASTER[PRODUCT_BRAND_NAME]),IQV_ENROLLMENT_DIM[BRANDNAME])
    )'
  assigned_table: Measure Table
  page_group: ''
  dependent_measures: []
- name: Enrollment from patient portal
  description: The DAX expression calculates the distinct count of member IDs from
    the IQV_ENROLLMENT_DIM table, specifically for enrollments made through the "Patient
    Portal" channel. It uses the columns MEMBERID, ENROLLMENTCHANNEL, and BRANDNAME
    from the IQV_ENROLLMENT_DIM table, and the PRODUCT_BRAND_NAME column from the
    US_PRODUCT_MASTER table. The calculation is filtered by the enrollment channel
    being "Patient Portal" and applies a filter on the brand name using the values
    from the PRODUCT_BRAND_NAME column.
  expression: 'CALCULATE(DISTINCTCOUNT(IQV_ENROLLMENT_DIM[MEMBERID]),

