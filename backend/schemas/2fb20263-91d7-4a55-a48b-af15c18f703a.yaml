tables:
- name: Org List
  description: The "Org List" table contains information about employees within an
    organization, including their names, email addresses, departments, phone numbers,
    job titles, and their direct supervisors. It provides a structured overview of
    the organizational hierarchy and contact details, particularly focusing on the
    manufacturing department.
  columns:
  - name: Name
    type: string
    sample_values:
    - Alex Nichols
    - Renee Cramer
    - Preety Sahdev
    - Leena Prasad
    - Sree Cheboyina
    description: The full name of the employee, typically including first and last
      names.
  - name: Email
